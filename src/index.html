<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The One Ring: Adversaries</title>
<link rel="stylesheet" href="css/styles.css" />
<script type="importmap">
{
	"imports": {
		"q/": "https://cdn.we-evolve.co.uk/js/q/v1.1.1/",
		"utils/": "./js/utils/",
		"tor/": "./js/modules/tor/"
	}
}
</script>
</head>
<body>

<div class="container">
	<!-- list of adversaries -->
	<nav data-q-component="menu">
		<div data-q-if="loading">Loading...</div>
		<div class="menu" data-q-if="!loading">
			<label>
				<div>
					<span>Filter</span>
					<small>(<span data-q-text="count"></span> of <span data-q-text="total"></span>)</small>
				</div>
				<input name="filter" type="search" data-q-keyup="handleFilter" data-q-search="handleFilter" />
			</label>
			<menu>
				<li data-q-each="adversaries" data-q-click="handleClick" data-q-text="title"></li>
			</menu>
		</div>
	</nav>

	<div>
		<!-- adversary info panel -->
		<article data-q-component="info">
			<div data-q-if="!hasAdversary">
				<h1>The One Ring: Adversaries</h1>
				<p>Welcome to the site</p>
			</div>
			<div data-q-if="hasAdversary" class="grid grid-cols-2">
				<div>
					<h1 data-q-text="title"></h1>
					<p data-q-text="description"></p>
					<div>
						<span class="chip" data-q-text="group"></span>
						<span class="chip" data-q-each="sources" data-q-text="source"></span>
						<span class="chip" data-q-each="adventures" data-q-text="adventure"></span>
					</div>
					<div class="btn-add">
						<button data-q-click="addAdversary">Add</button>
					</div>
				</div>
				<div class="card">
					<div class="grid grid-cols-2">
						<section>
							<h2 data-q-text="title"></h2>
							<div data-q-text="traits"></div>
						</section>
						<dl>
							<dt>Attribute Level</dt>
							<dd data-q-text="level"></dd>
						</dl>
					</div>
					<dl class="grid grid-cols-5">
						<div>
							<dt>Endurance</dt>
							<dd data-q-text="endurance"></dd>
						</div>
						<div>
							<dt>Might</dt>
							<dd data-q-text="might"></dd>
						</div>
						<div data-q-if="hasHate">
							<dt>Hate</dt>
							<dd data-q-text="hate"></dd>
						</div>
						<div data-q-if="hasResolve">
							<dt>Resolve</dt>
							<dd data-q-text="resolve"></dd>
						</div>
						<div>
							<dt>Parry</dt>
							<dd data-q-text="parry"></dd>
						</div>
						<div>
							<dt>Armour</dt>
							<dd data-q-text="armour"></dd>
						</div>
					</dl>
					<section>
						<h3>Combat Proficiencies</h3>
						<table>
							<thead>
								<tr>
									<th>Attack</th>
									<th>Skill</th>
									<th>Damage</th>
									<th>Injury</th>
									<th>Properties</th>
								</tr>
							</thead>
							<tbody>
								<tr data-q-each="attacks">
									<td data-q-text="attack"></td>
									<td data-q-text="skill"></td>
									<td data-q-text="damage"></td>
									<td data-q-text="injury"></td>
									<td data-q-text="properties"></td>
							</tbody>
						</table>
					</section>
					<section>
						<h3>Fell Abilities</h3>
						<div data-q-if="!hasAbilities">—</div>
						<details data-q-each="abilities">
							<summary data-q-text="name"></summary>
							<p data-q-html="ability"></p>
						</details>
					</section>
				</div>
			</div>
		</article>

		<!-- active adversaries -->
		<main data-q-component="manager">
			<div data-q-if="!hasAdversaries">No adversaries</div>
			<div data-q-if="hasAdversaries">
				<section class="card adversary" data-q-each="adversaries" data-q-component="adversary">
					<div class="title">
						<h2 class="link" data-q-text="title" data-q-click="showInfo"></h2>
						<div data-q-text="joinedTraits"></div>
					</div>
					<div class="grid grid-cols-3">
						<label>
							<span>Endurance</span>
							<input type="number" name="currentEndurance" data-q-input="currentEndurance" />
						</label>
						<label>
							<span>Might</span>
							<input type="number" name="currentMight" data-q-input="currentMight" />
						</label>
						<label data-q-if="hasHate">
							<span>Hate</span>
							<input type="number" name="currentHate" data-q-input="currentHate" />
						</label>
						<label data-q-if="hasResolve">
							<span>Resolve</span>
							<input type="number" name="currentResolve" data-q-input="currentResolve" />
						</label>
					</div>
					<div class="button">
						<button data-q-click="removeAdversary">Remove</button>
					</div>
				</section>
			</div>
		</main>
	</div>
</div>

<script type="module" src="./js/main.js"></script>

</body>
</html>
